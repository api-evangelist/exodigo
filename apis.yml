aid: exodigo
name: Exodigo
description: 'Exodigo is a subsurface intelligence company that maps what is underground
  and above ground without digging. Founded in 2021 by former Israeli intelligence
  officers and headquartered in the San Francisco Bay Area, it fuses ground-penetrating
  radar, electromagnetic (TDEM/FDEM), magnetic gradiometry and electrical sensing with
  GPS-RTK positioning, then processes the combined signal with AI to produce geolocated
  3D maps of buried utilities, foundations and geotechnical conditions. Products span
  ExoInfo remote data intelligence (AI compilation of public records, engineering
  documents and imagery), on-site reality capture, AI engineering and digitization, and
  utility relocation services. Deliverables are handed to customers as GIS and CAD
  artifacts (Esri ArcGIS, AutoCAD, BIM) and through a client portal rather than a public
  developer API — as of this profiling pass Exodigo publishes no developer portal, API
  documentation, OpenAPI/AsyncAPI specification, SDK or MCP server. Customers include
  LA Metro, Caltrans, National Grid, VINCI Construction and state DOTs.'
